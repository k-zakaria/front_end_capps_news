<header class="border-b border-gray-200">
  <div class="max-w-6xl mx-auto px-4">
    <!-- Top bar with sections, date, search and login -->
    <div class="flex justify-between items-center py-2">
      <button class="text-gray-800 text-xs font-medium uppercase tracking-wide">SECTIONS</button>
      <div class="flex items-center gap-4">
        <!-- Search input -->
        <div class="flex items-center relative">
          <input 
            type="text" 
            [(ngModel)]="searchQuery" 
            (keyup.enter)="performSearch()"
            placeholder="Search Capps News"
            class="border-b border-gray-300 focus:outline-none focus:border-black text-xs pr-8"
          />
          <button 
            (click)="performSearch()"
            class="absolute right-0 top-0"
          >
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-4 h-4">
              <path stroke-linecap="round" stroke-linejoin="round" d="m21 21-5.197-5.197m0 0A7.5 7.5 0 1 0 5.196 5.196a7.5 7.5 0 0 0 10.607 10.607Z" />
            </svg>
          </button>
        </div>

        <!-- Authentication Section -->
        @if (!user()) {
          <button 
            routerLink="/auth/login"
            class="bg-gray-200 text-gray-700 text-xs px-3 py-1 rounded hover:bg-gray-300"
          >
            Log in
          </button>
        } @else {
          <div class="relative">
            <button 
              (click)="toggleDropdown()"
              class="flex items-center gap-2 bg-gray-100 px-3 py-1 rounded hover:bg-gray-200"
            >
              <span class="w-6 h-6 rounded-full bg-blue-500 text-white flex items-center justify-center text-xs font-bold">
                {{ getUserInitials() }}
              </span>
              <span>{{ user()?.username }}</span>
              <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-4 h-4">
                <path stroke-linecap="round" stroke-linejoin="round" d="m19.5 8.25-7.5 7.5-7.5-7.5" />
              </svg>
            </button>

            @if (isDropdownOpen) {
              <div class="absolute right-0 mt-2 w-48 bg-white border rounded-md shadow-lg z-10">
                <div class="py-1">
                  <div class="px-4 py-2 text-sm text-gray-700 font-medium border-b">
                    My Account
                  </div>
                  <button 
                    (click)="goToProfile()"
                    class="w-full text-left px-4 py-2 text-sm hover:bg-gray-100 flex items-center gap-2"
                  >
                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-4 h-4">
                      <path stroke-linecap="round" stroke-linejoin="round" d="M15.75 6a3.75 3.75 0 1 1-7.5 0 3.75 3.75 0 0 1 7.5 0ZM4.501 20.118a7.5 7.5 0 0 1 14.998 0A17.933 17.933 0 0 1 12 21.75c-2.676 0-5.216-.584-7.499-1.632Z" />
                    </svg>
                    Profile
                  </button>
                  <button 
                    (click)="goToDashboard()"
                    class="w-full text-left px-4 py-2 text-sm hover:bg-gray-100 flex items-center gap-2"
                  >
                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-4 h-4">
                      <path stroke-linecap="round" stroke-linejoin="round" d="M10.5 6a7.5 7.5 0 1 0 7.5 7.5h-7.5V6Z" />
                      <path stroke-linecap="round" stroke-linejoin="round" d="M13.5 10.5H21A7.5 7.5 0 0 0 13.5 3v7.5Z" />
                    </svg>
                    Dashboard
                  </button>
                  <div class="border-t my-1"></div>
                  <button 
                    (click)="logout()"
                    class="w-full text-left px-4 py-2 text-sm text-red-500 hover:bg-red-50 flex items-center gap-2"
                  >
                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-4 h-4">
                      <path stroke-linecap="round" stroke-linejoin="round" d="M15.75 9V5.25A2.25 2.25 0 0 0 13.5 3h-6a2.25 2.25 0 0 0-2.25 2.25v13.5A2.25 2.25 0 0 0 7.5 21h6a2.25 2.25 0 0 0 2.25-2.25V15m3 0 3-3m0 0-3-3m3 3H9" />
                    </svg>
                    Logout
                  </button>
                </div>
              </div>
            }
          </div>
        }
      </div>
    </div>

    <!-- Logo section -->
    <div class="text-center py-6">
      <a routerLink="/" class="inline-block">
        <h1 class="text-5xl font-serif font-bold tracking-tight">Capps News</h1>
      </a>
    </div>

    <!-- Navigation links -->
    <nav class="flex justify-center space-x-8 py-3 border-t border-gray-200">
      @for (item of navItems; track item.path) {
        <a 
          [routerLink]="[item.path]"
          routerLinkActive="nav-active"
          class="text-sm font-medium hover:underline transition-all duration-200"
        >
          {{ item.label }}
        </a>
      }
    </nav>
  </div>
</header>
