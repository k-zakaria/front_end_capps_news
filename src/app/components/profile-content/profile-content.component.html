<div class="container mx-auto px-4 py-8">
    <div class="max-w-4xl mx-auto bg-white shadow-md rounded-lg overflow-hidden">
      <!-- Profile Header -->
      <div class="bg-gray-100 px-6 py-4 border-b flex items-center">
        <div class="w-16 h-16 rounded-full bg-blue-500 text-white flex items-center justify-center text-2xl font-bold mr-4">
          {{ getUserInitials() }}
        </div>
        <div>
          <h2 class="text-xl font-semibold text-gray-800">{{ profileForm.username }}</h2>
          <p class="text-gray-600">{{ profileForm.email }}</p>
        </div>
      </div>
  
      <!-- Tabs Navigation -->
      <div class="flex border-b">
        <button 
          (click)="setActiveTab('profile')"
          class="px-4 py-3 text-sm font-medium {{ activeTab === 'profile' ? 'text-blue-600 border-b-2 border-blue-600' : 'text-gray-600 hover:text-gray-800' }}"
        >
          Profile
        </button>
        <button 
          (click)="setActiveTab('security')"
          class="px-4 py-3 text-sm font-medium {{ activeTab === 'security' ? 'text-blue-600 border-b-2 border-blue-600' : 'text-gray-600 hover:text-gray-800' }}"
        >
          Security
        </button>
        <button 
          (click)="setActiveTab('preferences')"
          class="px-4 py-3 text-sm font-medium {{ activeTab === 'preferences' ? 'text-blue-600 border-b-2 border-blue-600' : 'text-gray-600 hover:text-gray-800' }}"
        >
          Preferences
        </button>
      </div>
  
      <!-- Profile Tab Content -->
      @if (activeTab === 'profile') {
        <form (ngSubmit)="saveProfile()" class="p-6 space-y-6">
          <div class="grid grid-cols-2 gap-6">
            <div>
              <label class="block text-sm font-medium text-gray-700 mb-2">Username</label>
              <input 
                type="text" 
                [(ngModel)]="profileForm.username" 
                name="username"
                class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500"
              />
            </div>
            <div>
              <label class="block text-sm font-medium text-gray-700 mb-2">Email</label>
              <input 
                type="email" 
                [(ngModel)]="profileForm.email" 
                name="email"
                class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500"
              />
            </div>
          </div>
          <div class="grid grid-cols-2 gap-6">
            <div>
              <label class="block text-sm font-medium text-gray-700 mb-2">First Name</label>
              <input 
                type="text" 
                [(ngModel)]="profileForm.firstName" 
                name="firstName"
                class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500"
              />
            </div>
            <div>
              <label class="block text-sm font-medium text-gray-700 mb-2">Last Name</label>
              <input 
                type="text" 
                [(ngModel)]="profileForm.lastName" 
                name="lastName"
                class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500"
              />
            </div>
          </div>
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-2">Bio</label>
            <textarea 
              [(ngModel)]="profileForm.bio" 
              name="bio"
              rows="4"
              class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500"
            ></textarea>
          </div>
          <div class="flex justify-end">
            <button 
              type="submit" 
              class="bg-blue-600 text-white px-6 py-2 rounded-md hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:ring-offset-2"
            >
              Save Changes
            </button>
          </div>
        </form>
      }
  
      <!-- Security Tab Content -->
      @if (activeTab === 'security') {
        <form (ngSubmit)="changePassword()" class="p-6 space-y-6">
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-2">Current Password</label>
            <input 
              type="password" 
              [(ngModel)]="passwordForm.currentPassword"
              name="currentPassword"
              class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500"
            />
          </div>
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-2">New Password</label>
            <input 
              type="password" 
              [(ngModel)]="passwordForm.newPassword"
              name="newPassword"
              class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500"
            />
          </div>
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-2">Confirm New Password</label>
            <input 
              type="password" 
              [(ngModel)]="passwordForm.confirmPassword"
              name="confirmPassword"
              class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500"
            />
          </div>
          <div class="flex justify-end">
            <button 
              type="submit"
              class="bg-blue-600 text-white px-6 py-2 rounded-md hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:ring-offset-2"
            >
              Change Password
            </button>
          </div>
        </form>
      }
  
      <!-- Preferences Tab Content -->
      @if (activeTab === 'preferences') {
        <div class="p-6 space-y-6">
          <div class="flex items-center justify-between">
            <div>
              <h3 class="text-lg font-medium text-gray-900">Email Notifications</h3>
              <p class="text-sm text-gray-500">Receive email updates about your account</p>
            </div>
            <label class="flex items-center cursor-pointer">
              <input 
                type="checkbox"
                class="hidden peer"
              />
              <div class="w-12 h-6 bg-gray-200 rounded-full peer-checked:bg-blue-600 relative">
                <div class="w-6 h-6 bg-white rounded-full absolute top-0 left-0 peer-checked:translate-x-6 transition-transform"></div>
              </div>
            </label>
          </div>
          <div class="flex items-center justify-between">
            <div>
              <h3 class="text-lg font-medium text-gray-900">Dark Mode</h3>
              <p class="text-sm text-gray-500">Enable dark theme for the application</p>
            </div>
            <label class="flex items-center cursor-pointer">
              <input 
                type="checkbox"
                class="hidden peer"
              />
              <div class="w-12 h-6 bg-gray-200 rounded-full peer-checked:bg-blue-600 relative">
                <div class="w-6 h-6 bg-white rounded-full absolute top-0 left-0 peer-checked:translate-x-6 transition-transform"></div>
              </div>
            </label>
          </div>
        </div>
      }
    </div>
  </div>
