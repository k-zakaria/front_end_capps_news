<div id="sidebar" class="bg-white w-64 min-h-screen border-r border-gray-200 transition-all duration-300">
    <div class="p-4 flex items-center justify-between">
        <img src="https://flowbite.com/docs/images/logo.svg" alt="Flowbite Logo" class="h-8">
        <button id="sidebar-toggle" class="text-gray-600 hover:text-gray-900" (click)="toggleSidebar()">
            <!-- Inline SVG for Menu Icon -->
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
                stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <line x1="3" y1="12" x2="21" y2="12"></line>
                <line x1="3" y1="6" x2="21" y2="6"></line>
                <line x1="3" y1="18" x2="21" y2="18"></line>
            </svg>
        </button>
    </div>
    <nav class="mt-4">
        <ul>
            <li *ngFor="let item of menuItems" class="px-4 py-2 hover:bg-gray-100"
                [ngClass]="{'bg-blue-50': item.active}">
                <a href="#" class="flex items-center text-gray-700">
                    <!-- Inline SVG for Icons -->
                    <svg *ngIf="item.icon === 'home'" xmlns="http://www.w3.org/2000/svg" width="24" height="24"
                        viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                        stroke-linejoin="round" class="mr-2">
                        <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
                        <polyline points="9 22 9 12 15 12 15 22"></polyline>
                    </svg>
                    <svg *ngIf="item.icon === 'file'" xmlns="http://www.w3.org/2000/svg" width="24" height="24"
                        viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                        stroke-linejoin="round" class="mr-2">
                        <path d="M13 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9z"></path>
                        <polyline points="13 2 13 9 20 9"></polyline>
                    </svg>
                    <svg *ngIf="item.icon === 'link'" xmlns="http://www.w3.org/2000/svg" width="24" height="24"
                        viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                        stroke-linejoin="round" class="mr-2">
                        <path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"></path>
                        <path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"></path>
                    </svg>
                    <span *ngIf="!isSidebarCollapsed">{{ item.label }}</span>
                </a>
            </li>
        </ul>
    </nav>
</div>
