<!-- top-nav.component.html -->
<div class="bg-white border-b border-gray-200 p-4 flex justify-between items-center">
  <div class="flex items-center">
    <input type="text" placeholder="Search..." class="px-4 py-2 border border-gray-300 rounded-lg">
  </div>
  <div class="flex items-center space-x-4">
    <button class="text-gray-600 hover:text-gray-900">
      <!-- Inline SVG for Bell Icon -->
      <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path>
        <path d="M13.73 21a2 2 0 0 1-3.46 0"></path>
      </svg>
    </button>
    <button class="text-gray-600 hover:text-gray-900">
      <!-- Inline SVG for Settings Icon -->
      <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="3"></circle>
        <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
      </svg>
    </button>
    <button class="text-gray-600 hover:text-gray-900" (click)="toggleTheme()">
      <!-- Inline SVG for Theme Toggle (Sun/Moon) -->
      <svg *ngIf="!isDarkMode" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="5"></circle>
        <line x1="12" y1="1" x2="12" y2="3"></line>
        <line x1="12" y1="21" x2="12" y2="23"></line>
        <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
        <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
        <line x1="1" y1="12" x2="3" y2="12"></line>
        <line x1="21" y1="12" x2="23" y2="12"></line>
        <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
        <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
      </svg>
      <!-- Moon Icon for Dark Mode -->
      <svg *ngIf="isDarkMode" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
      </svg>
    </button>
    <div class="relative">
      <button id="profile-dropdown" class="flex items-center" (click)="toggleProfileMenu()">
        <!-- Show either user avatar or initials in a circle -->
        <ng-container *ngIf="authService.isUserLoginenticated()">
          <div class="rounded-full h-8 w-8 bg-blue-500 flex items-center justify-center text-white">
            {{ getUserInitials() }}
          </div>
        </ng-container>
        
        <!-- Default avatar for non-authenticated users or while loading -->
        <img *ngIf="!authService.isUserLoginenticated()" src="https://via.placeholder.com/40" alt="User Avatar" class="rounded-full h-8 w-8">
      </button>
      
      <div id="profile-menu" class="absolute right-0 mt-2 w-48 bg-white border border-gray-200 rounded-lg shadow-lg z-10" 
           [ngClass]="{'hidden': !isProfileMenuOpen}">
        <div class="p-4 border-b">
          <p class="text-sm font-medium">{{ currentUser?.username || 'Guest' }}</p>
          
          <!-- Nous utilisons getCurrentUser() qui retourne UserLogin avec le rôle -->
          <ng-container *ngIf="getCurrentUserDetails()">
            <p *ngIf="getCurrentUserDetails()?.role" class="mt-1">
              <span class="bg-blue-100 text-blue-800 text-xs px-2 py-0.5 rounded">
                {{ getCurrentUserDetails()?.role }}
              </span>
            </p>
          </ng-container>
        </div>
        
        <div>
          <a routerLink="/profile" class="block w-full text-left px-4 py-2 text-sm text-gray-700 hover:bg-gray-100">
            Profile
          </a>
          <a routerLink="/settings" class="block w-full text-left px-4 py-2 text-sm text-gray-700 hover:bg-gray-100">
            Settings
          </a>
          <button (click)="logout()" class="w-full text-left px-4 py-2 text-sm text-red-600 hover:bg-gray-100 border-t">
            Logout
          </button>
        </div>
      </div>
    </div>
  </div>
</div>
