<body>
  <div id="webcrumbs">
    <div class="w-[400px] h-[500px] bg-black relative flex items-center justify-center overflow-hidden">
      <div
        class="absolute top-10 left-0 w-[160px] h-[160px] rounded-full bg-gradient-to-br from-blue-600 to-blue-300 blur-sm">
      </div>
      <div
        class="absolute bottom-10 right-0 w-[180px] h-[180px] rounded-full bg-gradient-to-tr from-orange-600 to-orange-300 blur-sm">
      </div>
      <div class="w-[320px] bg-gray-900/80 backdrop-blur-lg rounded-lg p-6 z-10 shadow-xl">
        <h2 class="text-white text-2xl font-bold mb-6 text-center">Login Here</h2>
        <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">
          <div class="mb-4">
            <label class="block text-white text-sm mb-2">Username</label>
            <input type="text" placeholder="Email or Phone"
              class="w-full bg-gray-800 text-gray-300 rounded py-2 px-3 focus:outline-none focus:ring-2 focus:ring-blue-500 transition-all"
              formControlName="username" />
          </div>
  
          <div class="mb-6">
            <label class="block text-white text-sm mb-2">Password</label>
            <input type="password" placeholder="Password"
              class="w-full bg-gray-800 text-gray-300 rounded py-2 px-3 focus:outline-none focus:ring-2 focus:ring-blue-500 transition-all"
              formControlName="password" />
          </div>
  
          <button type="submit"
            class="w-full bg-white text-gray-900 font-medium py-2 rounded mb-4 hover:bg-gray-100 transition-all transform hover:scale-[1.02] active:scale-[0.98]"
            [disabled]="loading">
            {{ loading ? 'Loading...' : 'Log In' }}
          </button>
  
          <div *ngIf="errorMessage" class="text-red-500 text-sm mb-4">
            {{ errorMessage }}
          </div>
        </form>
      </div>
    </div>
  </div>
</body>
