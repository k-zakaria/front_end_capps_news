<div class="max-w-6xl mx-auto px-4 py-8">
    <h2 class="text-2xl font-bold mb-6">
      Search Results for "{{ searchQuery }}"
    </h2>
    
    <div *ngIf="loading" class="text-center text-gray-500">
      Searching...
    </div>
    
    <div *ngIf="!loading && articles.length === 0" class="text-center text-gray-500">
      No results found. Try a different search term.
    </div>
    
    <div class="grid md:grid-cols-2 lg:grid-cols-3 gap-6">
      <div *ngFor="let article of articles" class="bg-white shadow-md rounded-lg overflow-hidden">
        <img 
          *ngIf="article.image"
          [src]="article.image" 
          alt="{{ article.title }}" 
          class="w-full h-48 object-cover"
        />
        <div class="p-4">
          <h3 class="text-xl font-bold mb-2 hover:text-blue-600 transition-colors">
            <a [routerLink]="['/article', article.id]">{{ article.title }}</a>
          </h3>
          <p class="text-gray-600 mb-2">{{ article.description }}</p>
          <div class="flex justify-between text-sm text-gray-500">
            <span>{{ article.publicationDate | date:'mediumDate' }}</span>
            <span>{{ article.category?.name }}</span>
          </div>
        </div>
      </div>
    </div>
  </div>
